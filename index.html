<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>L’Atelier du Prof</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: barre de séance (chrono 60 min) en haut, déroulé des phases à gauche, scène de cours au centre */
:root {
  --bg:#F2F4EE; --surface:#FFFFFF; --surface-2:#E7EBE1; --ink:#1C261F; --muted:#59665C; --line:#CDD5C7;
  --forest:#2E6A47; --forest-ink:#FFFFFF; --wood:#A86C14; --wood-soft:#F6E8CC;
  --ok:#2A7A4B; --ok-soft:#DCEFE2; --bad:#B03E2C; --bad-soft:#F7DED8; --hl:#F2D266; --hl-ink:#1C261F;
  --f-display:"Caprasimo", "Georgia", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --base:16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#101713; --surface:#18221C; --surface-2:#212D26; --ink:#E5ECE4; --muted:#9BA89F; --line:#2F3D34;
  --forest:#62B98A; --forest-ink:#0C1410; --wood:#E3AA52; --wood-soft:#3A2D16;
  --ok:#6FCC93; --ok-soft:#1B3326; --bad:#F28C78; --bad-soft:#3B211C; --hl:#C9A43A; --hl-ink:#14100A; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#101713; --surface:#18221C; --surface-2:#212D26; --ink:#E5ECE4; --muted:#9BA89F; --line:#2F3D34;
  --forest:#62B98A; --forest-ink:#0C1410; --wood:#E3AA52; --wood-soft:#3A2D16;
  --ok:#6FCC93; --ok-soft:#1B3326; --bad:#F28C78; --bad-soft:#3B211C; --hl:#C9A43A; --hl-ink:#14100A; color-scheme:dark }

* { box-sizing:border-box }
body { background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:var(--base); line-height:1.55 }
body.big { --base:20px }
button, select, textarea, input { font:inherit; color:inherit }
button { cursor:pointer }
:focus-visible { outline:3px solid var(--wood); outline-offset:2px }
h1,h2,h3 { text-wrap:balance; margin:0 }
.wrap { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }

/* Barre de séance */
.topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); border-bottom:1px solid var(--line) }
.topbar-in { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding-block:12px; max-width:1280px; margin:0 auto }
.brand { display:flex; flex-direction:column; min-width:0; flex:1 1 260px }
.brand .eyebrow { font-size:.72em; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.brand h1 { font-family:var(--f-display); font-weight:400; font-size:1.45em; line-height:1.15; color:var(--forest) }
.clock { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.clock .time { font-variant-numeric:tabular-nums; font-weight:700; font-size:1.25em }
.clock .phase-left { font-variant-numeric:tabular-nums; font-size:.85em; color:var(--muted) }
.clock .phase-left.over { color:var(--bad); font-weight:700 }
.btn { border:1px solid var(--line); background:var(--surface-2); padding:.45em .9em; border-radius:8px; font-size:.9em }
.btn:hover { border-color:var(--forest) }
.btn.primary { background:var(--forest); color:var(--forest-ink); border-color:var(--forest); font-weight:700 }
.btn.ghost { background:transparent }
.btn[aria-pressed="true"] { background:var(--wood-soft); border-color:var(--wood) }
.score { font-variant-numeric:tabular-nums; font-size:.85em; padding:.35em .7em; border-radius:999px; background:var(--wood-soft); color:var(--ink) }
.track { display:flex; gap:3px; padding-bottom:10px; max-width:1280px; margin:0 auto }
.track span { height:6px; border-radius:3px; background:var(--surface-2); position:relative; overflow:hidden }
.track span i { position:absolute; inset:0 auto 0 0; background:var(--forest); width:0 }
.track span.cur { outline:2px solid var(--wood); outline-offset:1px }

/* Grille principale */
.layout { display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; max-width:1280px; margin:0 auto; padding-block:24px 64px }
.phases { display:flex; flex-direction:column; gap:4px; position:sticky; top:calc(var(--hdr, 150px) + 16px); align-self:start }
.phases h2 { font-size:.72em; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:var(--f-body); margin:0 0 6px 10px }
.ph { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; text-align:left; border:0; background:transparent; padding:9px 10px; border-radius:8px }
.ph:hover { background:var(--surface-2) }
.ph .n { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:.8em; font-weight:700; background:var(--surface-2); border:1px solid var(--line); font-variant-numeric:tabular-nums }
.ph .d { font-size:.8em; color:var(--muted); font-variant-numeric:tabular-nums }
.ph.cur { background:var(--surface) ; box-shadow:0 0 0 1px var(--line) }
.ph.cur .n { background:var(--forest); color:var(--forest-ink); border-color:var(--forest) }
.ph.done .n { background:var(--ok-soft); border-color:var(--ok) }

main { min-width:0 }
.stage-head { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px; margin-bottom:18px }
.stage-head h2 { font-family:var(--f-display); font-weight:400; font-size:2em; line-height:1.1 }
.stage-head .meta { color:var(--muted); font-size:.9em }
.blocks { display:flex; flex-direction:column; gap:18px }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; min-width:0 }
.card h3 { font-size:1.05em; margin-bottom:10px }
.label { display:inline-block; font-size:.7em; letter-spacing:.08em; text-transform:uppercase; color:var(--wood); font-weight:700; margin-bottom:6px }
.note { background:var(--wood-soft); border:0; font-size:.92em }
.note .label { color:var(--ink) }
.support { font-size:1.2em; line-height:1.7; max-width:62ch }
mark { background:var(--hl); color:var(--hl-ink); padding:0 .2em; border-radius:3px }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center }
.answer { margin-top:10px; padding:10px 12px; border-radius:8px; background:var(--ok-soft); color:var(--ink) }
.answer::before { content:"Réponse attendue : "; font-weight:700 }
.choice { border:1px solid var(--line); background:var(--surface-2); padding:.5em .9em; border-radius:8px; text-align:left }
.choice.ok { background:var(--ok-soft); border-color:var(--ok) }
.choice.bad { background:var(--bad-soft); border-color:var(--bad) }
.fb { font-size:.9em; margin-top:8px; font-weight:700 }
.fb.ok { color:var(--ok) } .fb.bad { color:var(--bad) }

/* Schéma narratif */
.schema { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px }
.schema div { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--surface-2) }
.schema div.focus { background:var(--wood-soft); border-color:var(--wood) }
.schema b { display:block }
.schema small { color:var(--muted) }

/* Film */
.film-frame { position:relative; width:100%; max-width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#1d2b22 }
.film-frame svg { width:100%; height:100%; display:block; transform-origin:50% 60%; animation:kb 9s ease-out both }
@keyframes kb { from { transform:scale(1.06) } to { transform:scale(1) } }
@media (prefers-reduced-motion: reduce) { .film-frame svg { animation:none } }
.caption { margin-top:12px; display:flex; flex-direction:column; gap:6px }
.moment { align-self:flex-start; font-size:.72em; letter-spacing:.07em; text-transform:uppercase; font-weight:700; padding:.25em .6em; border-radius:999px; background:var(--forest); color:var(--forest-ink) }
.caption p { margin:0; font-size:1.15em; line-height:1.6 }
.dots { display:flex; gap:5px }
.dots i { width:9px; height:9px; border-radius:50%; background:var(--line) }
.dots i.on { background:var(--forest) }

/* Fixation */
.fix-rule { font-size:1.1em; margin-bottom:12px }
.fix-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:8px }
.fix-list button { text-align:left; padding:.7em .9em; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); font-weight:700 }
.fix-list button:hover { border-color:var(--forest) }

/* Exercices */
.chips { display:flex; flex-wrap:wrap; gap:8px }
.chip { border:1px solid var(--line); background:var(--surface-2); padding:.55em .9em; border-radius:8px }
.chip.on { background:var(--hl); color:var(--hl-ink); border-color:var(--wood) }
.chip.ok { box-shadow:0 0 0 2px var(--ok) }
.chip.bad { box-shadow:0 0 0 2px var(--bad) }
.chip.sel { outline:3px solid var(--forest); outline-offset:1px }
.fill { display:flex; flex-direction:column; gap:12px }
.fill p { margin:0; line-height:2 }
.fill select { padding:.3em .4em; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); max-width:100% }
.fill select.ok { border-color:var(--ok); background:var(--ok-soft) }
.fill select.bad { border-color:var(--bad); background:var(--bad-soft) }
.bins { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:14px }
.bin { border:2px dashed var(--line); border-radius:10px; padding:10px; min-height:110px; display:flex; flex-direction:column; gap:6px; background:transparent; text-align:left }
.bin:hover { border-color:var(--forest) }
.bin > b { font-size:.85em }
.bin .chip { font-size:.88em }
.intrus { display:flex; flex-direction:column; gap:12px }
textarea { width:100%; min-height:140px; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); line-height:1.6; resize:vertical }
.checks { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:6px }
.checks li { display:flex; gap:8px; align-items:baseline }
.checks li::before { content:"○"; color:var(--muted); font-weight:700 }
.checks li.ok::before { content:"✓"; color:var(--ok) }
.example { margin-top:12px; padding:12px; border-left:4px solid var(--wood); background:var(--wood-soft); border-radius:0 8px 8px 0 }

.pager { display:flex; justify-content:space-between; gap:10px; margin-top:24px; flex-wrap:wrap }
.speed { display:flex; align-items:center; gap:6px; font-size:.85em; color:var(--muted) }
.speed input { width:90px }
.tts-warn { font-size:.85em; color:var(--bad) }
.answers-hidden .answer { display:none }

@media (max-width: 860px) {
  .layout { grid-template-columns:minmax(0,1fr); gap:16px; padding-block:16px 48px }
  .phases { position:static; flex-direction:row; overflow-x:auto; padding-bottom:6px }
  .phases h2 { display:none }
  .ph { grid-template-columns:auto auto; flex:0 0 auto }
  .ph .d { display:none }
  .schema, .bins { grid-template-columns:minmax(0,1fr) }
  .stage-head h2 { font-size:1.6em }
}

/* Onglets, bibliothèque, documents (v1.1) */
.tabs { display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px }
.tab { border:0; background:transparent; padding:.45em .95em; border-radius:7px; font-weight:700; color:var(--muted) }
.tab:hover { color:var(--ink) }
.tab[aria-current="page"] { background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line) }
.lessonbar-in { border-top:1px solid var(--line) }
.lesson-h { font-family:var(--f-display); font-weight:400; font-size:1.2em; line-height:1.2; color:var(--forest) }
.view { max-width:1280px; margin:0 auto; padding-block:28px 64px }
.view-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:20px }
.view-head h2 { font-family:var(--f-display); font-weight:400; font-size:2em; line-height:1.1 }
.view-head p { margin:6px 0 0; color:var(--muted); max-width:62ch }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px }
.ccard { display:flex; flex-direction:column; gap:8px }
.ccard h3 { font-family:var(--f-display); font-weight:400; font-size:1.35em; line-height:1.2; margin:0 }
.ccard .meta { font-size:.85em; color:var(--muted); font-variant-numeric:tabular-nums }
.ccard .actions { margin-top:auto; padding-top:8px; display:flex; gap:8px; flex-wrap:wrap }
.ccard.add { border-style:dashed; background:transparent }
.prog { font-size:.85em; color:var(--wood); font-weight:700 }
.drop { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:30px 16px; border:2px dashed var(--line); border-radius:12px; background:var(--surface); cursor:pointer }
.drop:hover, .drop.over { border-color:var(--forest); background:var(--ok-soft) }
.drop:focus-within { outline:3px solid var(--wood); outline-offset:2px }
.drop input { position:absolute; opacity:0; width:1px; height:1px }
.drop b { font-size:1.1em }
.drop span { color:var(--muted); font-size:.9em }
.docs-list { display:flex; flex-direction:column; gap:8px; margin-top:16px }
.doc-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px }
.doc-row.cur { box-shadow:0 0 0 2px var(--forest) }
.badge { font-size:.72em; font-weight:700; letter-spacing:.06em; padding:.3em .55em; border-radius:6px; background:var(--surface-2); border:1px solid var(--line) }
.badge.pdf { color:var(--bad) } .badge.word { color:var(--forest) }
.doc-name { font-weight:700; overflow-wrap:anywhere }
.doc-meta { font-size:.82em; color:var(--muted); font-variant-numeric:tabular-nums }
.btn.danger { border-color:var(--bad); color:var(--bad) }
.viewer { margin-top:20px }
.viewer-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px }
.viewer-body { background:var(--surface-2); border-radius:10px; padding:12px; overflow-x:auto; display:flex; flex-direction:column; gap:12px; align-items:center; min-height:120px }
.viewer-body canvas { max-width:100%; height:auto; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.2) }
.doc-render { background:var(--surface); color:var(--ink); padding:24px; border-radius:8px; max-width:75ch; width:100%; line-height:1.65; font-size:1.05em; overflow-wrap:anywhere }
.doc-render img { max-width:100%; height:auto }
.doc-render table { border-collapse:collapse; display:block; overflow-x:auto }
.doc-render td, .doc-render th { border:1px solid var(--line); padding:4px 8px }
.msg { color:var(--muted); padding:16px; text-align:center }
.foot { max-width:1280px; margin:0 auto; padding-block:8px 32px; color:var(--muted); font-size:.8em }

/* v1.2 : filtres, durée, impression */
.sel { padding:.35em .5em; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink) }
.filters { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:20px }
.filters label { display:flex; flex-direction:column; gap:4px; font-size:.8em; color:var(--muted); font-weight:700 }
.filters input[type=search] { padding:.4em .6em; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); min-width:0; width:220px; max-width:100% }
.group { margin-bottom:28px }
.group > h3 { font-size:.78em; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 4px }
.group > h4 { font-family:var(--f-display); font-weight:400; font-size:1.3em; margin:0 0 12px; color:var(--forest) }
.tagline { display:flex; flex-wrap:wrap; gap:6px }
.tag { font-size:.75em; padding:.2em .55em; border-radius:999px; background:var(--surface-2); border:1px solid var(--line) }
.dlg { border:1px solid var(--line); border-radius:14px; padding:0; background:var(--surface); color:var(--ink); width:min(520px, calc(100vw - 32px)) }
.dlg::backdrop { background:rgba(0,0,0,.45) }
.dlg-in { display:flex; flex-direction:column; gap:12px; padding:22px }
.dlg-in h2 { font-family:var(--f-display); font-weight:400; font-size:1.5em }
.dlg-sub { margin:0; color:var(--muted); font-size:.9em }
.fld { display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:.9em }
.fld input { font-weight:400; padding:.5em .6em; border-radius:8px; border:1px solid var(--line); background:var(--surface-2) }
.dlg-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px }
.dlg-foot { display:flex; justify-content:flex-end }
.photo-view { max-width:100%; height:auto; border-radius:6px; background:#fff }
.subtabs { display:inline-flex; margin-bottom:20px }
.instr-card { margin-bottom:12px }
.instr-in { width:100%; min-height:0; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); line-height:1.5; resize:vertical }
.instr { margin-top:8px }
.instr-q { border-left:3px solid var(--wood); background:var(--wood-soft); padding:8px 12px; border-radius:0 8px 8px 0; margin-bottom:8px }
.instr-q .label { margin-bottom:2px }
.instr-q p { margin:0; white-space:pre-wrap }
.link-btn { border:0; background:none; padding:0; color:var(--forest); font-weight:700; text-decoration:underline; text-underline-offset:3px }
.copied { font-size:.85em; color:var(--ok); font-weight:700 }
.ph.syn { margin-top:6px; border-top:1px dashed var(--line); border-radius:0 0 8px 8px; padding-top:12px }
.ph.syn .n { background:var(--wood-soft); border-color:var(--wood) }
.tbl-wrap { overflow-x:auto }
.tbl { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums }
.tbl th, .tbl td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line) }
.tbl thead th { font-size:.8em; color:var(--muted); text-transform:uppercase; letter-spacing:.06em }
.tbl tfoot th { border-bottom:0 }
.tbl td.over { color:var(--bad); font-weight:700 }
.obj-list { display:flex; flex-direction:column; gap:12px }
.obj p { margin:0 0 6px }
.syn-list { margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px }
.pill { display:inline-block; font-size:.78em; font-weight:700; padding:.15em .55em; border-radius:999px; margin-left:4px; font-variant-numeric:tabular-nums }
.pill.ok { background:var(--ok-soft); color:var(--ok) } .pill.bad { background:var(--bad-soft); color:var(--bad) } .pill.wait { background:var(--surface-2); color:var(--muted) }
.sec-h { font-size:1.05em; margin:24px 0 2px }
.sec-sub { margin:0 0 10px; color:var(--muted); font-size:.9em }
.fiche-row.cur { box-shadow:0 0 0 2px var(--forest) }
.ren { padding:.4em .6em; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); min-width:0; flex:1 1 220px }
.fiche-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:14px 16px }
.num { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:64px; padding:6px 8px; border-radius:10px; background:var(--wood-soft); font-family:var(--f-display); font-size:1.5em; line-height:1; font-variant-numeric:tabular-nums }
.num small { font-family:var(--f-body); font-size:.45em; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px }
.fiche-state { margin-top:4px; font-size:.8em; font-weight:700 }
.fiche-state.ok { color:var(--ok) } .fiche-state.wait { color:var(--wood) }
@media (max-width: 860px) { .fiche-row { grid-template-columns:auto minmax(0,1fr) } .fiche-row .row { grid-column:1 / -1 } }
.dlg-wide { width:min(980px, calc(100vw - 32px)) }
.src-body { max-height:72vh; overflow:auto; display:flex; justify-content:center; background:var(--surface-2); border-radius:10px; padding:10px }
#print-area { display:none }
@media print {
  @page { size:A4; margin:14mm }
  body > *:not(#print-area) { display:none !important }
  #print-area { display:block !important; color:#000; background:#fff; font-family:var(--f-body); font-size:11pt; line-height:1.45 }
  body { background:#fff !important }
}
.pr h1 { font-family:var(--f-display); font-weight:400; font-size:18pt; margin:0 0 4mm; color:#000 }
.pr h2 { font-size:12.5pt; margin:5mm 0 2mm; border-bottom:1px solid #000; padding-bottom:1mm }
.pr table { width:100%; border-collapse:collapse; margin-bottom:4mm }
.pr th, .pr td { border:1px solid #000; padding:2mm 2.5mm; vertical-align:top; text-align:left }
.pr th { background:#eee; width:30% }
.pr .dt th { width:auto }
.pr .dt td:nth-child(2) { white-space:nowrap }
.pr .ident { display:flex; gap:8mm; margin-bottom:4mm }
.pr .box { border:1px solid #000; padding:3mm; margin:2mm 0 3mm }
.pr .q { margin:2.5mm 0 1mm; font-weight:700 }
.pr .ln { border-bottom:1px dotted #000; height:7mm }
.pr .ans { font-style:italic; margin:1mm 0 2mm 4mm }
.pr .cells { display:flex; flex-wrap:wrap; gap:2mm }
.pr .cells span { border:1px solid #000; padding:1mm 2.5mm }
.pr .cells span.good { background:#ddd; font-weight:700 }
.pr .blk { break-inside:avoid }
.pr .foot-pr { margin-top:6mm; font-size:8.5pt; color:#444 }
@media (max-width: 860px) {
  .topbar { position:static }
  .doc-row { grid-template-columns:auto minmax(0,1fr) }
  .doc-row .row { grid-column:1 / -1 }
  .view-head h2 { font-size:1.6em }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in wrap">
    <div class="brand">
      <span class="eyebrow">L’assistant de l’enseignant de français</span>
      <h1>L’Atelier du Prof</h1>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-go="">Cours</button>
      <button class="tab" data-go="documents">Mes documents</button>
    </nav>
    <button class="btn" id="big" aria-pressed="false">Projection</button>
  </div>
  <div id="lessonbar" hidden>
    <div class="topbar-in wrap lessonbar-in">
      <div class="brand">
        <span class="eyebrow" id="eyebrow"></span>
        <h2 class="lesson-h" id="lesson-title"></h2>
      </div>
      <div class="clock">
        <span class="time" id="clock">00:00 / 60:00</span>
        <span class="phase-left" id="phase-left"></span>
        <button class="btn primary" id="play">Démarrer le cours</button>
        <button class="btn ghost" id="reset" title="Remettre le chrono à zéro">Remettre à zéro</button>
      </div>
      <div class="row">
        <label class="speed" for="duree-select">Durée
          <select id="duree-select" class="sel">
            <option value="45">45 min</option><option value="60">1 h</option><option value="90">1 h 30</option><option value="120">2 h</option>
          </select>
        </label>
        <button class="btn" id="answers" aria-pressed="false" title="Pour projeter sans montrer les réponses">Cacher les réponses</button>
        <button class="btn" id="src-open" hidden>Fiche d’origine</button>
        <button class="btn" id="print-open">Imprimer…</button>
      </div>
    </div>
    <div class="track wrap" id="track"></div>
  </div>
</header>

<section id="view-lib" class="view wrap" hidden></section>
<section id="view-docs" class="view wrap" hidden></section>
<div id="view-lesson" class="layout wrap" hidden>
  <nav class="phases" id="phases" aria-label="Déroulé de la séance"></nav>
  <main id="stage"></main>
</div>
<footer class="foot wrap">L’Atelier du Prof · application version <span id="ver"></span></footer>

<dialog id="print-dlg" class="dlg" aria-labelledby="print-title">
  <form method="dialog" class="dlg-in" id="print-form">
    <h2 id="print-title">Imprimer ce cours</h2>
    <p class="dlg-sub">Votre nom et votre établissement apparaissent sur la fiche pédagogique. Ils restent sur cet appareil.</p>
    <label class="fld" for="pf-nom">Enseignant(e)<input id="pf-nom" type="text" autocomplete="name" placeholder="Ex. : Mme Boukelkha"></label>
    <label class="fld" for="pf-etab">Établissement<input id="pf-etab" type="text" placeholder="Ex. : CEM Rahou Mohamed"></label>
    <div class="dlg-actions">
      <button class="btn primary" type="button" data-print="peda">Fiche pédagogique</button>
      <button class="btn primary" type="button" data-print="eleve">Fiche élève</button>
      <button class="btn primary" type="button" data-print="corrige">Corrigé</button>
    </div>
    <div class="dlg-foot"><button class="btn ghost" value="close">Fermer</button></div>
  </form>
</dialog>
<dialog id="src-dlg" class="dlg dlg-wide" aria-labelledby="src-title">
  <div class="dlg-in">
    <div class="viewer-head">
      <h2 id="src-title">Fiche d’origine</h2>
      <div class="row" id="src-pages"></div>
      <button class="btn" id="src-close">Fermer</button>
    </div>
    <p class="dlg-sub" id="src-cap"></p>
    <div class="src-body" id="src-body"></div>
  </div>
</dialog>
<div id="print-area"></div>

<script src="cours/catalogue.js"></script>
<script src="cours/fiches.js"></script>
<script>
/* =========================================================
   L’ATELIER DU PROF : le CODE de l'application.
   Version de l'application (à changer à chaque publication du code,
   voir CHANGELOG.md). Les cours ne sont PAS ici : ils sont dans
   cours/<id>.js et listés dans cours/catalogue.js.
   Types de blocs d'un cours : note, support, schema, question, film,
   fixation, colorier, completer, trier, intrus, production, liens.
   ========================================================= */
const APP_VERSION = "1.4.0";
window.COURS = window.COURS || [];

/* ============ État ============ */
let L = null, S = null, total = 0;
const PREF = { big:false, hide:false, rate:0.9 };
function save(){ if (!L || !S) return; try { localStorage.setItem("classe-conte:"+L.id, JSON.stringify({phase:S.phase, spent:S.spent, total:S.total, scores:S.scores})) } catch(e){} }
function readSaved(id){ try { return JSON.parse(localStorage.getItem("classe-conte:"+id)||"null") } catch(e){ return null } }

/* ============ Utilitaires ============ */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const k in (props||{})) {
    const v = props[k];
    if (k==="class") e.className = v;
    else if (k==="html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c==null || c===false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const fmt = s => { const a=Math.abs(s); return String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0"); };
const strip = s => s.replace(/<[^>]+>/g,"");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

/* ============ Voix (synthèse vocale du navigateur) ============ */
const TTS = "speechSynthesis" in window;
let frVoice = null;
function pickVoice(){ if(!TTS) return; const v = speechSynthesis.getVoices(); frVoice = v.find(x=>/^fr(-|_)FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null; }
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, onend){
  if (!TTS) { if (onend) setTimeout(onend, Math.max(4000, text.length*60)); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(strip(text));
  u.lang = "fr-FR"; if (frVoice) u.voice = frVoice; u.rate = PREF.rate;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
function stopSpeak(){ if (TTS) speechSynthesis.cancel(); }
function listenBtn(text, label){ return h("button",{class:"btn", onclick:()=>speak(text)}, label||"Écouter"); }

/* ============ Score ============ */
function setScore(key, ok, tot){ S.scores[key] = {ok, tot}; renderScore(); save(); }
function renderScore(){
  let o=0,t=0; Object.values(S.scores).forEach(s=>{o+=s.ok;t+=s.tot});
  const el = document.getElementById("score"); if (el) el.textContent = `${o} / ${t}`;
}

/* ============ Illustrations du film (SVG) ============ */
function trees(){ return [40,130,515,605].map(x=>`<rect x="${x-8}" y="170" width="16" height="95" fill="#6B4423"/><polygon points="${x-48},215 ${x},95 ${x+48},215" fill="#2F5D34"/><polygon points="${x-38},170 ${x},62 ${x+38},170" fill="#3B7342"/>`).join(""); }
function ground(c){ return `<rect y="255" width="640" height="105" fill="${c||"#5E8C4A"}"/>`; }
function river(){ return `<path d="M0 285 Q160 270 320 288 T640 282 V340 Q480 352 320 336 T0 342Z" fill="#4A90B8"/><path d="M60 300 q20 -6 40 0 M250 312 q20 -6 40 0 M440 300 q20 -6 40 0" stroke="#D6EEF8" stroke-width="3" fill="none" opacity=".8"/>`; }
function man(x, mood){
  const y=150, mouth = mood==="happy" ? `<path d="M${x-9} ${y+16} q9 9 18 0" stroke="#3A2416" stroke-width="2.5" fill="none"/>` : mood==="sad" ? `<path d="M${x-9} ${y+21} q9 -8 18 0" stroke="#3A2416" stroke-width="2.5" fill="none"/>` : `<circle cx="${x}" cy="${y+19}" r="4" fill="#3A2416"/>`;
  const tear = mood==="sad" ? `<path d="M${x+11} ${y+6} q4 8 0 11 q-4 -3 0 -11Z" fill="#8FD0F0"/>` : "";
  return `<rect x="${x-16}" y="${y+78}" width="12" height="40" fill="#3B3226"/><rect x="${x+4}" y="${y+78}" width="12" height="40" fill="#3B3226"/>
  <rect x="${x-24}" y="${y+28}" width="48" height="56" rx="8" fill="#E9E2CF"/><rect x="${x-24}" y="${y+28}" width="14" height="56" fill="#5A3A22"/><rect x="${x+10}" y="${y+28}" width="14" height="56" fill="#5A3A22"/>
  <circle cx="${x}" cy="${y+8}" r="20" fill="#E8B98A"/><path d="M${x-18} ${y+12} q18 30 36 0 q-4 18 -18 20 q-14 -2 -18 -20Z" fill="#4A3220"/>
  <ellipse cx="${x}" cy="${y-9}" rx="30" ry="6" fill="#2E2116"/><rect x="${x-17}" y="${y-28}" width="34" height="20" rx="4" fill="#2E2116"/>
  <circle cx="${x-7}" cy="${y+4}" r="2.5" fill="#1D140C"/><circle cx="${x+7}" cy="${y+4}" r="2.5" fill="#1D140C"/>${mouth}${tear}`;
}
function axe(x,y,c,rot){ return `<g transform="translate(${x} ${y}) rotate(${rot||0})"><rect x="-3" y="-10" width="6" height="70" rx="3" fill="#7A4E26"/><path d="M3 -10 h22 q8 12 0 26 h-22Z" fill="${c}" stroke="#00000033"/></g>`; }
function genie(x){ return `<circle cx="${x}" cy="170" r="85" fill="#BFF0FF" opacity=".25"/><path d="M${x-40} 250 q-10 -90 40 -110 q50 20 40 110 q-40 30 -80 0Z" fill="#7FC8D9"/><circle cx="${x}" cy="125" r="24" fill="#9ADBE8"/><circle cx="${x-8}" cy="122" r="3" fill="#123"/><circle cx="${x+8}" cy="122" r="3" fill="#123"/><path d="M${x-8} 134 q8 6 16 0" stroke="#123" stroke-width="2.5" fill="none"/>`; }
function logs(){ return [0,1,2].map(i=>`<rect x="${400+i*6}" y="${300-i*18}" width="110" height="18" rx="9" fill="#8A5A2E"/><circle cx="${400+i*6}" cy="${309-i*18}" r="9" fill="#C99A62"/>`).join(""); }
function house(){ return `<rect x="420" y="170" width="150" height="100" fill="#C9A27A"/><polygon points="405,175 495,105 585,175" fill="#8A3B2A"/><rect x="480" y="210" width="34" height="60" fill="#5A3A22"/><rect x="435" y="195" width="30" height="26" fill="#F6E08A"/>`; }
function sky(day){ return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${day?"#9BD3F0":"#F5C98B"}"/><stop offset="1" stop-color="${day?"#E4F3E8":"#FBE9C9"}"/></linearGradient></defs><rect width="640" height="360" fill="url(#sk)"/>`; }
function sceneSVG(k){
  let b = "";
  switch(k){
    case "forest": b = sky(1)+`<circle cx="560" cy="60" r="30" fill="#FFE07A"/>`+ground()+trees()+logs()+man(260,"happy")+axe(300,215,"#9AA4AA",-25); break;
    case "fall": b = sky(1)+ground()+trees()+river()+man(220,"neutral")+axe(430,262,"#9AA4AA",150)+`<ellipse cx="430" cy="300" rx="40" ry="8" fill="#E9F7FF" opacity=".9"/>`; break;
    case "sad": b = sky(0)+ground("#55784A")+trees()+river()+man(300,"sad"); break;
    case "gold": b = sky(1)+ground()+river()+man(180,"neutral")+genie(450)+axe(500,150,"#E8B923",20); break;
    case "silver": b = sky(1)+ground()+river()+man(180,"neutral")+genie(450)+axe(500,150,"#D7DDE2",20); break;
    case "iron": b = sky(1)+ground()+river()+man(180,"happy")+genie(450)+axe(500,150,"#6E767C",20); break;
    case "end": b = sky(0)+`<circle cx="90" cy="70" r="34" fill="#FFD36E"/>`+ground()+house()+man(250,"happy")+axe(320,210,"#E8B923",10)+axe(345,210,"#D7DDE2",10)+axe(370,210,"#6E767C",10); break;
  }
  return `<svg viewBox="0 0 640 360" role="img" aria-label="Illustration de la scène" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
}

/* ============ Rendu des blocs ============ */
let filmTimer = null;
const R = {
  note: b => h("div",{class:"card note"}, h("span",{class:"label"},"Conseil pour l’enseignant(e)"), h("div",null,b.text)),

  support: b => h("div",{class:"card"}, h("span",{class:"label"}, b.titre),
    h("p",{class:"support", html:b.html}), h("div",{class:"row"}, listenBtn(b.html, "Écouter le texte"))),

  schema: () => h("div",{class:"card"}, h("span",{class:"label"},"Les moments du conte"),
    h("div",{class:"schema"},
      h("div",{class:"focus"}, h("b",null,"1. Situation initiale"), h("small",null,"Quand ? Où ? Qui ? Ouverte par une formule d’ouverture.")),
      h("div",null, h("b",null,"2. Déroulement"), h("small",null,"Élément perturbateur, péripéties, dénouement.")),
      h("div",null, h("b",null,"3. Situation finale"), h("small",null,"Souvent fermée par une formule de clôture.")))),

  question: (b,key) => {
    const card = h("div",{class:"card"});
    card.append(h("h3",null,b.q));
    if (b.choices) {
      const fb = h("div",{class:"fb"});
      let answered = false;
      const row = h("div",{class:"row"});
      b.choices.forEach((c,i)=>{
        const btn = h("button",{class:"choice", onclick:()=>{
          if (answered) return; answered = true;
          const ok = i===b.correct;
          btn.classList.add(ok?"ok":"bad");
          if (!ok) row.children[b.correct].classList.add("ok");
          fb.className = "fb "+(ok?"ok":"bad"); fb.textContent = ok ? "Bravo, c’est juste !" : "Pas tout à fait. La bonne réponse est en vert.";
          setScore(key, ok?1:0, 1);
        }}, c);
        row.append(btn);
      });
      card.append(row, fb);
    }
    card.append(h("div",{class:"answer"}, b.a));
    return card;
  },

  film: b => {
    let i = 0, auto = false;
    const frame = h("div",{class:"film-frame"});
    const moment = h("span",{class:"moment"});
    const text = h("p");
    const dots = h("div",{class:"dots"}, b.scenes.map(()=>h("i")));
    const playBtn = h("button",{class:"btn primary"},"Lire le conte");
    function show(n){
      i = Math.max(0, Math.min(b.scenes.length-1, n));
      const sc = b.scenes[i];
      frame.innerHTML = sceneSVG(sc.s);
      moment.textContent = sc.m; text.innerHTML = sc.t;
      [...dots.children].forEach((d,k)=>d.classList.toggle("on", k===i));
    }
    function next(){ if (!auto) return; if (i < b.scenes.length-1) { show(i+1); speak(b.scenes[i].t, next); } else { auto=false; playBtn.textContent="Relire le conte"; } }
    playBtn.onclick = () => {
      if (auto) { auto=false; stopSpeak(); playBtn.textContent="Reprendre"; return; }
      if (playBtn.textContent==="Relire le conte") show(0);
      auto = true; playBtn.textContent = "Pause";
      speak(b.scenes[i].t, next);
    };
    show(0);
    return h("div",{class:"card"}, h("span",{class:"label"},"Mini-film narré · "+b.titre), frame,
      h("div",{class:"caption"}, moment, text),
      h("div",{class:"row", style:"margin-top:12px; justify-content:space-between"},
        h("div",{class:"row"},
          h("button",{class:"btn", onclick:()=>{auto=false; stopSpeak(); show(i-1)}},"‹ Scène précédente"),
          playBtn,
          h("button",{class:"btn", onclick:()=>{auto=false; stopSpeak(); show(i+1)}},"Scène suivante ›"),
          h("button",{class:"btn ghost", onclick:()=>{auto=false; stopSpeak(); show(0); playBtn.textContent="Lire le conte"}},"Recommencer")),
        dots),
      TTS ? null : h("p",{class:"tts-warn"},"La lecture à voix haute n’est pas disponible sur ce navigateur : les scènes défilent seules, lisez le texte à la classe."));
  },

  fixation: b => h("div",{class:"card"}, h("span",{class:"label"},"Je retiens"),
    h("p",{class:"fix-rule", html:b.rule}),
    h("div",{class:"fix-list"}, b.items.map(t=>h("button",{onclick:()=>speak(t)}, t))),
    h("div",{class:"row", style:"margin-top:12px"}, listenBtn(b.items.join(" ; "), "Écouter toutes les formules"))),

  colorier: (b,key) => {
    const st = new Set();
    const chips = h("div",{class:"chips"});
    const fb = h("div",{class:"fb"});
    b.items.forEach(([t],k)=> chips.append(h("button",{class:"chip", onclick:e=>{ st.has(k)?st.delete(k):st.add(k); e.currentTarget.classList.toggle("on"); [...chips.children].forEach(c=>c.classList.remove("ok","bad")); fb.textContent=""; }}, t)));
    const check = () => {
      let ok = 0;
      b.items.forEach(([,good],k)=>{ const c=chips.children[k]; const right = st.has(k)===!!good; c.classList.toggle("ok", right && st.has(k)); c.classList.toggle("bad", !right); if (right) ok++; });
      fb.className = "fb "+(ok===b.items.length?"ok":"bad");
      fb.textContent = ok===b.items.length ? "Parfait : toutes les formules d’ouverture sont coloriées." : `${ok} / ${b.items.length} cases justes. Les erreurs sont entourées en rouge.`;
      setScore(key, ok, b.items.length);
    };
    return h("div",{class:"card"}, h("h3",null,b.titre), chips,
      h("div",{class:"row", style:"margin-top:12px"}, h("button",{class:"btn primary", onclick:check},"Vérifier")), fb,
      h("div",{class:"answer"}, b.items.filter(x=>x[1]).map(x=>x[0]).join(" · ")));
  },

  completer: (b,key) => {
    const sels = [];
    const box = h("div",{class:"fill"});
    b.phrases.forEach((p,k)=>{
      const [, after] = p.split("___");
      const s = h("select",{id:`${key}-s${k}`, "aria-label":"Formule pour la phrase "+(k+1)}, h("option",{value:""},"Choisir…"), b.options.map(o=>h("option",{value:o},o)));
      sels.push(s);
      box.append(h("p",null, `${k+1}) `, s, after));
    });
    const fb = h("div",{class:"fb"});
    const check = () => {
      let ok=0; sels.forEach(s=>{ const good=b.good.includes(s.value); s.classList.toggle("ok",good); s.classList.toggle("bad",!good); if(good) ok++; });
      fb.className="fb "+(ok===sels.length?"ok":"bad");
      fb.textContent = ok===sels.length ? "Très bien ! Chaque phrase commence par une formule d’ouverture." : `${ok} / ${sels.length}. « Soudain », « Enfin », « Ensuite » ne servent pas à ouvrir un conte.`;
      setScore(key, ok, sels.length);
    };
    return h("div",{class:"card"}, h("h3",null,b.titre), box,
      h("div",{class:"row", style:"margin-top:12px"}, h("button",{class:"btn primary", onclick:check},"Vérifier"), listenBtn(b.phrases.map((p,k)=>p.replace("___", sels[k]?.value||"…")).join(" "), "Écouter mes phrases")), fb,
      h("div",{class:"answer"}, "Plusieurs réponses possibles : Il était une fois, Il y a très longtemps, Autrefois, Jadis."));
  },

  trier: (b,key) => {
    let sel = null;
    const where = new Map();
    const pool = h("div",{class:"chips"});
    const bins = h("div",{class:"bins"});
    const fb = h("div",{class:"fb"});
    const chipEls = shuffle(b.items.map((it,k)=>[it,k])).map(([it,k])=>{
      const c = h("button",{class:"chip", "data-k":k, onclick:e=>{ e.stopPropagation(); [...document.querySelectorAll(".chip.sel")].forEach(x=>x.classList.remove("sel")); sel = c; c.classList.add("sel"); }}, it[0]);
      return c;
    });
    chipEls.forEach(c=>pool.append(c));
    b.bins.forEach((name,bi)=>{
      const bin = h("button",{class:"bin", onclick:()=>{ if(!sel) return; bin.append(sel); where.set(+sel.dataset.k, bi); sel.classList.remove("sel","ok","bad"); sel=null; fb.textContent=""; }}, h("b",null,name));
      bins.append(bin);
    });
    const check = () => {
      let ok=0;
      chipEls.forEach(c=>{ const k=+c.dataset.k; const right = where.get(k)===b.items[k][1]; c.classList.toggle("ok", right); c.classList.toggle("bad", where.has(k) && !right); if(right) ok++; });
      fb.className="fb "+(ok===b.items.length?"ok":"bad");
      fb.textContent = ok===b.items.length ? "Tout est bien classé !" : `${ok} / ${b.items.length} bien classées.`;
      setScore(key, ok, b.items.length);
    };
    return h("div",{class:"card"}, h("h3",null,b.titre),
      h("p",{style:"margin:0 0 10px; color:var(--muted); font-size:.9em"},"Touchez une expression, puis la boîte où elle va."),
      pool, bins,
      h("div",{class:"row", style:"margin-top:12px"}, h("button",{class:"btn primary", onclick:check},"Vérifier")), fb,
      h("div",{class:"answer"}, b.bins.map((n,bi)=>n+" : "+b.items.filter(x=>x[1]===bi).map(x=>x[0]).join(", ")).join(" | ")));
  },

  intrus: (b,key) => {
    const res = {};
    const wrap = h("div",{class:"intrus"});
    b.rows.forEach((r,ri)=>{
      const fb = h("div",{class:"fb"});
      const row = h("div",{class:"chips"});
      r.items.forEach((t,i)=> row.append(h("button",{class:"chip", onclick:e=>{
        if (ri in res) return;
        const ok = i===r.i; res[ri]=ok;
        e.currentTarget.classList.add(ok?"ok":"bad"); row.children[r.i].classList.add("on");
        fb.className="fb "+(ok?"ok":"bad"); fb.textContent=(ok?"Oui ! ":"Non. ")+r.why;
        setScore(key, Object.values(res).filter(Boolean).length, b.rows.length);
      }}, t)));
      wrap.append(h("div",null,row,fb));
    });
    return h("div",{class:"card"}, h("h3",null,b.titre), wrap);
  },

  production: b => {
    const ta = h("textarea",{id:"prod-text", placeholder:"Il était une fois…"});
    const checks = [
      ["J’ai commencé par une formule d’ouverture", t=>/^\s*(il était une fois|il y avait une fois|il y a (bien |très )?longtemps|autrefois|jadis|dans un passé lointain|en des temps (très )?anciens|dans le vieux temps)/i.test(t)],
      ["J’ai présenté le personnage (Blanche-Neige)", t=>/blanche[\s-]?neige/i.test(t)],

/* Durée de séance modifiable : les étapes gardent leurs proportions */
const baseTotal = c => c.phases.reduce((s,p)=>s+p.duree,0);
function scaleDurees(phases, T){
  const B = phases.reduce((s,p)=>s+p.duree,0);
  const raw = phases.map(p=>p.duree*T/B);
  const out = raw.map(x=>Math.max(1, Math.floor(x)));
  let rest = T - out.reduce((a,b)=>a+b,0);
  const order = raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);
  for (let k=0; rest>0; k=(k+1)%order.length) { out[order[k][1]]++; rest--; }
  return out;
}
function setDuree(T){ total = T; S.total = T; S.durees = scaleDurees(L.phases, T); }

function printBlock(b, ans){
  switch(b.type){
    case "support": return `<div class="blk"><div class="box">${plain(b.html)}</div></div>`;
    case "question": {
      let s = `<div class="blk"><p class="q">${plain(b.q)}</p>`;
      if (b.choices) s += `<div class="cells">${b.choices.map((c,i)=>`<span class="${ans && i===b.correct ? "good" : ""}">☐ ${esc(c)}</span>`).join("")}</div>`;
      s += ans ? `<p class="ans">${plain(b.a)}</p>` : (b.choices ? "" : lines(2));
      return s + "</div>";
    }
    case "fixation": return `<div class="blk"><div class="box"><b>Je retiens :</b> ${plain(b.rule)}<br>${b.items.map(esc).join(" · ")}</div></div>`;
    case "colorier": return `<div class="blk"><p class="q">${plain(b.titre)}</p><div class="cells">${b.items.map(([t,g])=>`<span class="${ans && g ? "good" : ""}">${esc(t)}</span>`).join("")}</div></div>`;
    case "completer": return `<div class="blk"><p class="q">${plain(b.titre)}</p>`
      + (ans ? "" : `<p><i>Mots possibles :</i> ${b.options.map(esc).join(" / ")}</p>`)
      + b.phrases.map((p,k)=>`<p>${k+1}) ${esc(p).replace("___", ans ? `<b>${esc(b.good[k % b.good.length])}</b>` : "……………………")}</p>`).join("")
      + (ans ? `<p class="ans">Toute formule d’ouverture est acceptée : ${b.good.map(esc).join(", ")}.</p>` : "") + "</div>";
    case "trier": {
      const rowsN = Math.max(...b.bins.map((_,bi)=>b.items.filter(x=>x[1]===bi).length));
      let t = `<div class="blk"><p class="q">${plain(b.titre)}</p>` + (ans ? "" : `<p><i>Expressions :</i> ${b.items.map(x=>esc(x[0])).join(" · ")}</p>`);
      t += `<table class="dt"><thead><tr>${b.bins.map(n=>`<th>${esc(n)}</th>`).join("")}</tr></thead><tbody>`;
      for (let r=0; r<rowsN; r++) t += "<tr>" + b.bins.map((_,bi)=>{ const it = b.items.filter(x=>x[1]===bi)[r]; return `<td>${ans && it ? esc(it[0]) : "&nbsp;"}</td>`; }).join("") + "</tr>";
      return t + "</tbody></table></div>";
    }
    case "intrus": return `<div class="blk"><p class="q">${plain(b.titre)}</p>` + b.rows.map(r=>`<div class="cells" style="margin-bottom:2mm">${r.items.map((t,i)=>`<span class="${ans && i===r.i ? "good" : ""}">${esc(t)}</span>`).join("")}</div>${ans ? `<p class="ans">${esc(r.why)}</p>` : ""}`).join("") + "</div>";
    case "production": return `<div class="blk"><p class="q">${plain(b.consigne)}</p>${ans ? `<p class="ans">Exemple : ${esc(b.exemple)}</p>` : lines(7)}</div>`;
    default: return "";
  }
}
function ficheEleve(ans){
  const PRINTABLE = ["support","question","fixation","colorier","completer","trier","intrus","production"];
  const parts = L.phases.map(p=>{

/* ============ Synthèse du cours (dernière étape de chaque séance) ============ */
const EXOS = ["colorier","completer","trier","intrus"];

function bilanLoad(){ try { return JSON.parse(localStorage.getItem("atelier:bilan:"+L.id)||"{}") } catch(e){ return {} } }
function bilanSave(b){ try { localStorage.setItem("atelier:bilan:"+L.id, JSON.stringify(b)) } catch(e){} }
/* Toutes les données de la synthèse, calculées à partir du cours : sert à l'écran et à l'impression */
function syntheseData(){
  const sy = L.synthese || {};
  const temps = L.phases.map((p,i)=>({ titre:p.titre, prevu:S.durees[i]*60, reel:S.spent[i] }));
  const retenir = [];
  L.phases.forEach(p=>p.blocs.forEach(b=>{ if (b.type==="fixation") retenir.push(strip(b.rule) + (b.items?.length ? " " + b.items.join(" ; ") : "")); }));
  (sy.retenir||[]).forEach(r=>retenir.push(r));
  const exos = [];
  L.phases.forEach((p,pi)=>p.blocs.forEach((b,bi)=>{
    if (EXOS.includes(b.type) || (b.type==="question" && b.choices)) {
      const sc = S.scores[`p${pi}b${bi}`];
      exos.push({ etape:p.titre, titre:strip(exoTitre(b)), sc, faible: sc && sc.tot && sc.ok/sc.tot < 0.7 });
    }
  }));
  const remed = [...(sy.remediation||[])];
  exos.filter(e=>e.faible && !e.titre.match(/^\d\)/)).forEach(e=>remed.push(`Reprendre en remédiation : « ${e.titre} » (${e.sc.ok} / ${e.sc.tot}).`));
  return { sy, temps, retenir, exos, remed, objectifs:(L.fiche?.objectifs)||[] };
}

const DOCS = {
  db:null, mem:[], ok:true,
  async open(){
    if (this.db || !this.ok) return this.db;
    try { this.db = await new Promise((res,rej)=>{ const r = indexedDB.open("classe-conte-docs",1); r.onupgradeneeded = ()=>r.result.createObjectStore("docs",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
    catch(e){ this.ok = false; }
    return this.db;
  },
  async all(){ const db = await this.open(); if (!db) return this.mem.slice();
    return new Promise(res=>{ try { const q = db.transaction("docs").objectStore("docs").getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>res([]); } catch(e){ res([]) } }); },
  async put(d){ const db = await this.open(); if (!db) { this.mem.push(d); return; }
    return new Promise((res,rej)=>{ const t = db.transaction("docs","readwrite"); t.objectStore("docs").put(d); t.oncomplete=res; t.onerror=()=>rej(t.error); }); },
  async del(id){ const db = await this.open(); if (!db) { this.mem = this.mem.filter(d=>d.id!==id); return; }
    return new Promise(res=>{ const t = db.transaction("docs","readwrite"); t.objectStore("docs").delete(id); t.oncomplete=res; t.onerror=res; }); }
};

async function addFiles(files){
  let last = null; const bad = [];
  const ib = document.getElementById("doc-instr");
  const instruction = ib ? ib.value.trim() : "";
  for (const f of files) {
    const k = kindOf(f.name);
    if (!k) { bad.push(f.name); continue; }
    const all = await DOCS.all();
    const num = all.reduce((m,x)=>Math.max(m, x.num||0), 0) + 1;
    const d = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), num, titre:autoTitre(f.name), name:f.name, kind:k, size:f.size, added:new Date().toISOString(), blob:f, instruction, statut: instruction ? "a-envoyer" : "" };
    try { await DOCS.put(d); last = d; } catch(e){ bad.push(f.name+" (espace insuffisant)"); }
  }
  if (last && ib) { ib.value = ""; try { sessionStorage.removeItem("atelier:instr") } catch(e){} }
  await refreshDocs(bad.length ? "Non ajouté (formats acceptés : Word .docx, PDF, photo JPG ou PNG) : "+bad.join(", ") : "");
  if (last) openDoc(last);
}
/* Titre lisible tiré du nom du fichier ; les noms d'appareil photo deviennent « Photo du … » */
function autoTitre(name){
  let t = name.replace(/\.[^.]+$/,"");
  const m = t.match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  if (/^(img|dsc|pxl|photo|whatsapp image|screenshot|capture|scan)/i.test(t) || /^[\d_\- ]+$/.test(t))
    { const quoi = /\.(pdf|docx?)$/i.test(name) ? "Document" : "Photo";
      return m ? `${quoi} du ${m[3]}/${m[2]}/${m[1]}` : `${quoi} sans titre`; }
  t = t.replace(/[_\-]+/g," ").replace(/\s+/g," ").trim();
  return t ? t.charAt(0).toUpperCase()+t.slice(1) : "Document sans titre";
}

    };
    const titleBox = h("div",{class:"doc-name"}, d.titre);

    ren.onclick = () => {
      const inp = h("input",{id:"ren-"+d.id, type:"text", class:"ren", value:d.titre, "aria-label":"Nouveau titre"});
      const ok = async () => { const v = inp.value.trim(); if (v) { d.titre = v; await DOCS.put(d); } refreshDocs(); };
      inp.addEventListener("keydown", e=>{ if (e.key==="Enter") ok(); if (e.key==="Escape") refreshDocs(); });
      titleBox.replaceWith(h("div",{class:"row"}, inp, h("button",{class:"btn primary", onclick:ok},"Enregistrer")));
      inp.focus(); inp.select();
    };
    const instrBox = renderInstr(d);
    list.append(h("div",{class:"card fiche-row"+(d.id===openDocId?" cur":"")},
      h("div",{class:"num"}, h("small",null,"Ajout"), String(d.num)),
      h("div",{style:"min-width:0"}, titleBox,
        h("div",{class:"doc-meta"}, `${({pdf:"PDF",word:"Word",photo:"Photo",heic:"Photo HEIC"})[d.kind]||"Document"} · ${d.name} · ${sizeFr(d.size)} · ajouté le ${dateFr(d.added)}`),
        instrBox),
      h("div",{class:"row"}, h("button",{class:"btn primary", onclick:()=>openDoc(d)},"Ouvrir"), ren, del)));
  });
}
async function openDoc(d){
  openDocId = d.id; refreshDocs();
  const viewer = document.getElementById("viewer");
  const body = h("div",{class:"viewer-body"}, h("p",{class:"msg"},"Ouverture du document…"));
  const tools = h("div",{class:"row"});
  viewer.innerHTML = "";
  viewer.append(h("div",{class:"viewer-head"}, h("h3",{style:"overflow-wrap:anywhere; min-width:0"}, `Ajout ${d.num||""} : ${d.titre||d.name}`),
    h("div",{class:"row"}, tools, h("button",{class:"btn", onclick:()=>{ openDocId=null; viewer.innerHTML=""; stopSpeak(); refreshDocs(); }},"Fermer"))), body);
  viewer.scrollIntoView({behavior:"smooth", block:"start"});
  try {
    if (d.kind==="doc") { body.innerHTML = ""; body.append(h("p",{class:"msg"},"Ce fichier est au format Word ancien (.doc). Ouvrez-le dans Word et enregistrez-le en .docx ou en PDF, puis ajoutez-le de nouveau.")); return; }
    const buf = await d.blob.arrayBuffer();
    if (d.kind==="heic") { body.innerHTML = ""; body.append(h("p",{class:"msg"},"Cette photo est au format HEIC (iPhone), que les navigateurs n’affichent pas. Sur l’iPhone : Réglages › Appareil photo › Formats › « Le plus compatible », ou envoyez-la en JPG.")); return; }
    if (d.kind==="photo") {
      const url = URL.createObjectURL(d.blob);
      body.innerHTML = ""; body.append(h("img",{class:"photo-view", src:url, alt:"Photo : "+d.name}));
      return;
    }
    if (d.kind==="word") {
      const mammoth = await needLib("word");
      const out = await mammoth.convertToHtml({arrayBuffer:buf});
      const doc = h("div",{class:"doc-render", html:out.value || "<p>(document vide)</p>"});
      body.innerHTML = ""; body.append(doc);
      if (TTS) tools.append(h("button",{class:"btn", onclick:()=>speak(doc.textContent)},"Lire à voix haute"), h("button",{class:"btn ghost", onclick:stopSpeak},"Arrêter"));
    } else {
      const lib = await needLib("pdf");
      const pdf = await lib.getDocument({data:new Uint8Array(buf)}).promise;
      body.innerHTML = "";
      const max = Math.min(pdf.numPages, 60);
      const w = Math.min(body.clientWidth - 24, 900), dpr = Math.min(window.devicePixelRatio||1, 2);
      for (let i=1; i<=max; i++) {
        if (openDocId!==d.id) return;
        const page = await pdf.getPage(i);
        const scale = w / page.getViewport({scale:1}).width;
        const vp = page.getViewport({scale:scale*dpr});
        const cv = h("canvas",{width:String(Math.floor(vp.width)), height:String(Math.floor(vp.height)), "aria-label":`Page ${i} sur ${pdf.numPages}`});
        cv.style.width = Math.floor(vp.width/dpr)+"px";
        body.append(cv);
        await page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
      }
      if (pdf.numPages>max) body.append(h("p",{class:"msg"},`Seules les ${max} premières pages sont affichées.`));
    }
  } catch(e) {
    body.innerHTML = "";
    body.append(h("p",{class:"msg"},"Impossible d’afficher ce fichier. La première ouverture demande une connexion internet ; si elle est active, le fichier est peut-être abîmé ou protégé par mot de passe."));
  }
}

document.getElementById("ver").textContent = APP_VERSION;
loadCourses().then(route);
